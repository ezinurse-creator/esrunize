<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Applied Sociology</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --p50:#faf5ff;--p100:#f3e8ff;--p200:#e9d5ff;--p300:#d8b4fe;
  --p400:#c084fc;--p500:#a855f7;--p600:#9333ea;--p700:#7e22ce;
  --p800:#6b21a8;--p900:#581c87;
  --w:#fff;--g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;
  --g300:#cbd5e1;--g400:#94a3b8;--g500:#64748b;--g700:#334155;--g900:#0f172a;
  --ok:#16a34a;--ok-lt:#dcfce7;--err:#dc2626;--err-lt:#fee2e2;
  --warn:#d97706;--warn-lt:#fef3c7;
  --r:12px;--rs:8px;
  --s1:0 1px 3px rgba(109,40,217,.08);
  --s2:0 4px 12px rgba(109,40,217,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--g50);color:var(--g900);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:90;background:var(--w);border-bottom:1px solid var(--g200);display:flex;align-items:center;padding:0 16px;height:54px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.tb-back{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:var(--p100);color:var(--p700);font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;margin-right:12px}
.tb-back:hover{background:var(--p200)}
.tb-info{flex:1;min-width:0}
.tb-title{font-size:.88rem;font-weight:700;color:var(--g900);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-sub{font-size:.65rem;color:var(--g400);font-weight:500;margin-top:1px}
.tb-chip{background:var(--p100);color:var(--p700);border:1px solid var(--p200);font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0}
.hero{background:linear-gradient(145deg,var(--p900),var(--p700) 55%,var(--p500));padding:28px 18px 24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.08),transparent 50%),radial-gradient(circle at 10% 85%,rgba(255,255,255,.05),transparent 40%)}
.hero::after{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero-dot-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);font-size:.65rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:4px 10px;border-radius:30px;margin-bottom:12px}
.hero-eyebrow-dot{width:5px;height:5px;background:#c4b5fd;border-radius:50%}
.hero h1{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.02em;margin-bottom:7px}
.hero h1 em{color:rgba(255,255,255,.45);font-style:italic;font-weight:300}
.hero-desc{font-size:.82rem;color:rgba(255,255,255,.55);line-height:1.55;margin-bottom:18px}
.hero-cta{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);color:#fff;font-size:.8rem;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;transition:all .2s;backdrop-filter:blur(6px)}
.hero-cta:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.hero-stats{display:flex;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12)}
.hs{flex:1;text-align:center}
.hs+.hs{border-left:1px solid rgba(255,255,255,.1)}
.hs-n{font-size:1.35rem;font-weight:800;color:#fff;line-height:1}
.hs-l{font-size:.6rem;color:rgba(255,255,255,.45);margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.main{padding:16px 14px 56px}
.divider{display:flex;align-items:center;gap:8px;margin-bottom:12px;margin-top:2px}
.divider span{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g400)}
.divider::after{content:'';flex:1;height:1px;background:var(--g200)}
.uc{background:var(--w);border:1.5px solid var(--g200);border-radius:var(--r);margin-bottom:9px;overflow:hidden;box-shadow:var(--s1);transition:border-color .2s,box-shadow .2s}
.uc:hover{border-color:var(--p300);box-shadow:var(--s2)}
.uc[data-open=true]{border-color:var(--p400);box-shadow:var(--s2)}
.ubtn{width:100%;display:flex;align-items:center;padding:14px 15px;gap:12px;background:none;border:none;cursor:pointer;text-align:left}
.upill{min-width:54px;padding:0 8px;height:36px;border-radius:9px;flex-shrink:0;background:var(--p100);display:flex;align-items:center;justify-content:center;transition:background .2s}
.upill span{font-size:.65rem;font-weight:800;color:var(--p700);letter-spacing:-.01em;white-space:nowrap}
.uc[data-open=true] .upill{background:var(--p700)}
.uc[data-open=true] .upill span{color:#fff}
.uinfo{flex:1;min-width:0}
.uname{font-size:.85rem;font-weight:700;color:var(--g900);line-height:1.3}
.umeta{font-size:.66rem;color:var(--g400);margin-top:2px;font-weight:500}
.uright{display:flex;align-items:center;gap:7px;flex-shrink:0}
.uchev{width:16px;height:16px;color:var(--g300);transition:transform .3s,color .2s}
.uc[data-open=true] .uchev{transform:rotate(180deg);color:var(--p500)}
.ubody{display:none;background:var(--p50);border-top:1.5px solid var(--p200);padding:12px 13px 14px}
.ubody.open{display:block;animation:bodyIn .2s ease}
@keyframes bodyIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.rrow{display:flex;gap:9px;margin-bottom:8px}
.rrow:last-child{margin-bottom:0}
@media(max-width:380px){.rrow{flex-direction:column}}
.rbtn{flex:1;display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:var(--rs);border:1.5px solid transparent;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .17s;background:var(--w);text-decoration:none}
.rbtn .rico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.rbtn .rtxt{line-height:1.25}
.rbtn .rtxt small{display:block;font-size:.62rem;font-weight:400;opacity:.5;margin-top:1px}
.rbtn .rarr{margin-left:auto;opacity:0;font-size:.7rem;color:var(--g400);transition:opacity .15s}
.rbtn:hover .rarr{opacity:1}
.rbtn.notes{border-color:var(--p200);color:var(--p800)}
.rbtn.notes .rico{background:var(--p100)}
.rbtn.notes:hover{background:var(--p50);border-color:var(--p500);box-shadow:var(--s2);transform:translateY(-1px)}
.rbtn.video{border-color:#bae6fd;color:#0369a1}
.rbtn.video .rico{background:#e0f2fe}
.rbtn.video:hover{background:#f0f9ff;border-color:#38bdf8;box-shadow:0 3px 10px rgba(56,189,248,.12);transform:translateY(-1px)}
.rbtn.quiz{border-color:#fde68a;color:#78350f}
.rbtn.quiz .rico{background:var(--warn-lt)}
.rbtn.quiz:hover{background:#fffbeb;border-color:var(--warn);box-shadow:0 3px 10px rgba(217,119,6,.12);transform:translateY(-1px)}
.qoverlay{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end}
.qoverlay.open{display:flex}
.qscrim{position:absolute;inset:0;background:rgba(15,10,40,.55);backdrop-filter:blur(3px)}
.qpanel{position:relative;z-index:1;background:var(--w);width:100%;max-width:580px;margin:0 auto;border-radius:18px 18px 0 0;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -10px 50px rgba(109,40,217,.2);animation:panelUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes panelUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.qhead{padding:16px 18px 12px;border-bottom:1px solid var(--g100);flex-shrink:0}
.qhead-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qtitle{font-size:1rem;font-weight:800;color:var(--p800)}
.qclose{width:28px;height:28px;border-radius:50%;background:var(--g100);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--g500);transition:all .15s}
.qclose:hover{background:var(--err-lt);color:var(--err)}
.qpips{display:flex;gap:3px}
.pip{flex:1;height:4px;border-radius:4px;background:var(--g100);transition:background .3s}
.pip.ans{background:var(--p300)}.pip.cor{background:var(--ok)}.pip.wrg{background:var(--err)}
.qbody{overflow-y:auto;padding:14px 18px 28px;flex:1}
.qscore{display:none;background:linear-gradient(135deg,var(--p800),var(--p500));color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:16px;align-items:center;gap:14px}
.qscore.show{display:flex}
.qs-num{font-size:1.9rem;font-weight:800;line-height:1}
.qs-sub{font-size:.65rem;opacity:.6;margin-top:2px}
.qs-msg{font-size:.85rem;font-weight:600}
.qitem{margin-bottom:24px}
.qitem:last-child{margin-bottom:0}
.qlbl{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p500);margin-bottom:4px}
.qtext{font-size:.88rem;font-weight:600;color:var(--g900);line-height:1.5;margin-bottom:10px}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopt{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);cursor:pointer;font-size:.83rem;font-weight:500;background:var(--w);color:var(--g700);transition:all .14s}
.qopt:hover{border-color:var(--p300);background:var(--p50);color:var(--p800)}
.qltr{width:21px;height:21px;border-radius:50%;background:var(--g100);border:1px solid var(--g200);display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:800;color:var(--g500);flex-shrink:0;transition:all .14s}
.qopt.cor{background:var(--ok-lt);border-color:#86efac;color:#14532d}
.qopt.cor .qltr{background:var(--ok);border-color:var(--ok);color:#fff}
.qopt.wrg{background:var(--err-lt);border-color:#fca5a5;color:#7f1d1d}
.qopt.wrg .qltr{background:var(--err);border-color:var(--err);color:#fff}
.qopt.lock{cursor:default;pointer-events:none}
.qopt.lock:not(.cor):not(.wrg):hover{border-color:var(--g200);background:var(--w);color:var(--g700)}
/* Full-screen video player (YouTube links) */
.vp{position:fixed;inset:0;z-index:700;background:#000;display:none;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.vp.open{display:block}
.vp-area{position:absolute;left:0;right:0;bottom:0;top:var(--vp-top,0px)}
.vp-box{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;background:#000}
@media (orientation:portrait){
  .vp.rot .vp-box{width:calc(100vh - var(--vp-top,0px));height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg)}
}
.vp-stage,.vp-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
/* Clear covers that stop taps reaching YouTube's own buttons and links */
.vp-guard{position:absolute;left:0;right:0;z-index:1}
.vp-guard.top{top:0;height:30%}
.vp-guard.bot{bottom:0;height:30%}
.vp-tap{position:absolute;inset:0;z-index:2;display:none;transition:background .2s}
.vp.started .vp-tap{display:block}
.vp.paused .vp-tap{background:rgba(0,0,0,.5)}
.vp:not(.started) .vp-guard.top{background:linear-gradient(#000 50%,transparent)}
.vp:not(.started) .vp-guard.bot{background:linear-gradient(transparent,#000 50%)}
.vp.ended .vp-tap{background:rgba(0,0,0,.9)}
/* Player controls */
.vp-ui{position:absolute;inset:0;z-index:3;pointer-events:none;transition:opacity .25s}
.vp-ui.hide{opacity:0}
.vp-ui.hide *{pointer-events:none!important}
.vp-top,.vp-bot{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px}
.vp-top{top:0;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.vp-bot{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));display:none;flex-direction:column;align-items:stretch;gap:2px;padding-top:28px}
.vp-row{display:flex;align-items:center;gap:8px}
.vp-gap{flex:1}
.vp.started .vp-bot{display:flex}
.vp-ic{pointer-events:auto;min-width:40px;height:40px;padding:0 10px;border-radius:20px;border:none;background:rgba(255,255,255,.16);color:#fff;font:700 .78rem 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.vp-ic:active{background:rgba(255,255,255,.32)}
.vp-title{flex:1;min-width:0;color:#fff;font-size:.85rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.vp:not(.started) .vp-title{visibility:hidden}
.vp-time{color:#fff;font-size:.72rem;font-weight:600;min-width:36px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}
.vp-seek{pointer-events:auto;flex:1;min-width:60px;height:36px;position:relative;cursor:pointer;touch-action:none}
.vp-rail{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgba(255,255,255,.3)}
.vp-fill{height:100%;width:0;border-radius:2px;background:#c084fc}
.vp-knob{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(192,132,252,.45)}
.vp-big{pointer-events:auto;position:absolute;top:50%;left:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer}
.vp.started.paused .vp-big,.vp.started.ended .vp-big{display:flex}
/* If YouTube's control script can't load, fall back to YouTube's own controls */
.vp.native .vp-guard,.vp.native .vp-tap,.vp.native .vp-bot,.vp.native .vp-big{display:none!important}
</style>
</head>

        <button class="rbtn video" onclick="openVideo(this,'https://youtu.be/hRgEENrFah4')"><div class="rico">▶️</div><div class="rtxt">Video Lecture<small>Significance in Nursing</small></div></button>
      </div>
      <div class="rrow">
        <button class="rbtn notes" onclick="openPDF('https://drive.google.com/file/d/1h-SCRZQdlhuSjx6NuUn8B_cz3c7MRLac/view')"><div class="rico">📝</div><div class="rtxt">Lecture Notes<small>Significance</small></div></button>
        <button class="rbtn video" onclick="openVideo(this,'https://youtu.be/YAewxlERfJo')"><div class="rico">▶️</div><div class="rtxt">Video Lecture<small>Branches of Sociology</small></div></button>

    </button>
    <div class="ubody" id="b-u2">
      <div class="rrow">
        <button class="rbtn notes" onclick="openPDF('https://drive.google.com/file/d/1xdwGthzzd0zsASOL8d5okW0uIRW5iqpB/view')"><div class="rico">📚</div><div class="rtxt">Detailed Notes<small>Social Structure</small></div></button>

      <div class="rrow">

        <button class="rbtn video" onclick="openVideo(this,'https://youtu.be/mr71jbzhjug')"><div class="rico">▶️</div><div class="rtxt">Video Lecture<small>Social Processes</small></div></button>
      </div>
      <div class="rrow">
        <button class="rbtn notes" onclick="openPDF('https://drive.google.com/file/d/1ka8HPemgx4HljgioeWJJHLkitVGvMsJG/view')"><div class="rico">📝</div><div class="rtxt">Lecture Notes<small>Social Processes</small></div></button>
        <button class="rbtn video" onclick="openVideo(this,'https://youtu.be/68ksmksNYBg')"><div class="rico">▶️</div><div class="rtxt">Video Lecture<small>Socialization & Change</small></div></button>
      </div>
      <div class="rrow">
        <button class="rbtn notes" onclick="openPDF('https://drive.google.com/file/d/1sDQQ4mDZGty2jDR9AAdZPk2_8H5OhqFc/view')"><div class="rico">📝</div><div class="rtxt">Lecture Notes<small>Socialization</small></div></button>
        <button class="rbtn video" onclick="openVideo(this,'https://youtu.be/o40gyaJForU')"><div class="rico">▶️</div><div class="rtxt">Video Lecture<small>Community & Health</small></div></button>

<script>
function goBackToApp(){if(window.parent&&window.parent!==window){window.parent.postMessage({action:'goBack'},'*');}else{history.back();}}
function openPDF(url){
  if(!url || url==='COMING SOON' || url===''){ alert('This resource is coming soon!'); return; }
  const clean=url.replace(/\/preview.*$/,'').replace(/\/view.*$/,'')+'/view';
  window.open(clean,'_blank');
}

// ── VIDEO PLAYER ──────────────────────────────────────────────
// To move a lecture to YouTube, paste its YouTube link in place of the Drive link, e.g.
//   onclick="openVideo(this,'https://youtu.be/VIDEO_ID')"
// YouTube videos open full screen in landscape with this page's own controls
// (play/pause, -10s/+10s, a timeline you can drag, speed). YouTube's own buttons and
// links are covered so they can't be tapped. The phone's back button closes the player.
// Drive links still open the old way.
const VP={player:null,ready:false,started:false,dragging:false,dragT:null,timer:null,hideT:null,apiT:null,speeds:[1,1.25,1.5,2],speed:0,saved:null,queue:[],apiLoading:false};
const VP_PLAY='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const VP_PAUSE='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
function vpEl(id){ return document.getElementById(id); }
function ytId(url){
  const s=String(url||'').trim();
  if(/^[\w-]{11}$/.test(s)) return s;
  const m=s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
  return m?m[1]:null;
}
function vpFmt(s){
  s=Math.max(0,Math.floor(s||0));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0');
  return h ? h+':'+String(m).padStart(2,'0')+':'+x : m+':'+x;
}
function vpRotated(){ return vpEl('vp').classList.contains('rot') && window.matchMedia('(orientation: portrait)').matches; }
function vpSetTimes(t,d){
  vpEl('vp-cur').textContent=vpFmt(t);
  vpEl('vp-dur').textContent=vpFmt(d);
  const r=d?Math.min(1,Math.max(0,t/d)):0;
  vpEl('vp-fill').style.width=(r*100)+'%';
  vpEl('vp-knob').style.left=(r*100)+'%';
}
function vpPlaying(){ const p=VP.player; return !!(p&&p.getPlayerState&&p.getPlayerState()===1); }
// Controls fade out after 3 seconds of playing; tapping the video brings them back
function vpShowUI(){
  const ui=vpEl('vp-ui');
  ui.classList.remove('hide');
  clearTimeout(VP.hideT);
  if(VP.started&&!VP.dragging&&vpPlaying()) VP.hideT=setTimeout(()=>ui.classList.add('hide'),3000);
}
function vpTapScreen(){
  const ui=vpEl('vp-ui');
  if(ui.classList.contains('hide')||!vpPlaying()) vpShowUI();
  else { clearTimeout(VP.hideT); ui.classList.add('hide'); }
}
// Hide the app's purple header and zoom button while a video is open (this page sits inside the app's frame)
function vpAppChrome(hide){
  try{
    if(window.parent===window) return;
    const pd=window.parent.document;
    if(hide){
      const header=pd.getElementById('main-header');
      if(header) vpEl('vp').style.setProperty('--vp-top',window.parent.getComputedStyle(header).paddingTop);
      VP.saved=[];
      [header,pd.getElementById('fab-zoom')].forEach(e=>{ if(e){ VP.saved.push([e,'display',e.style.display]); e.style.display='none'; } });
      const wrap=pd.getElementById('iframe-wrapper');
      if(wrap){ VP.saved.push([wrap,'width',wrap.style.width]); wrap.style.width='100%'; }
    } else if(VP.saved){
      VP.saved.forEach(([e,prop,val])=>{ e.style[prop]=val; });
      VP.saved=null;
    }
  }catch(e){}
}
function vpLoadApi(cb){
  if(window.YT&&window.YT.Player){ cb(); return; }
  VP.queue.push(cb);
  if(VP.apiLoading) return;
  VP.apiLoading=true;
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=function(){
    if(typeof prev==='function'){ try{ prev(); }catch(e){} }
    const q=VP.queue; VP.queue=[];
    q.forEach(f=>{ try{ f(); }catch(e){} });
  };
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>{ VP.apiLoading=false; };
  document.head.appendChild(s);
}
// YouTube player states: -1 not started, 0 ended, 1 playing, 2 paused, 3 buffering, 5 ready
function vpState(s){
  const vp=vpEl('vp');
  if(s===1&&!VP.started){ VP.started=true; vp.classList.add('started'); }
  vp.classList.toggle('paused',s===2);
  vp.classList.toggle('ended',s===0);
  vpEl('vp-play').innerHTML=(s===1||s===3)?VP_PAUSE:VP_PLAY;
  vpEl('vp-big').innerHTML=VP_PLAY;
  vpShowUI();
}
function vpTick(){
  const p=VP.player;
  if(!p||!p.getCurrentTime||VP.dragging) return;
  vpSetTimes(p.getCurrentTime()||0,p.getDuration()||0);
}
function vpToggle(){
  const p=VP.player;
  if(!p||!p.getPlayerState) return;
  const s=p.getPlayerState();
  if(s===1||s===3) p.pauseVideo();
  else { if(s===0) p.seekTo(0,true); p.playVideo(); }
  vpShowUI();
}
function vpSkip(d){
  const p=VP.player;
  if(!p||!p.getCurrentTime) return;
  const dur=p.getDuration()||0;
  let t=(p.getCurrentTime()||0)+d;
  t=Math.max(0,dur?Math.min(dur-1,t):t);
  p.seekTo(t,true);
  vpSetTimes(t,dur);
  vpShowUI();
}
function vpSpeed(){
  const p=VP.player;
  if(!p||!p.setPlaybackRate) return;
  VP.speed=(VP.speed+1)%VP.speeds.length;
  const r=VP.speeds[VP.speed];
  p.setPlaybackRate(r);
  vpEl('vp-speed').textContent=r+'×';
  vpShowUI();
}
// Timeline: drag (or tap) anywhere on it to jump. Works the same when the video is turned sideways.
(function(){
  const bar=vpEl('vp-seek');
  const ratio=e=>{
    const r=bar.getBoundingClientRect();
    const x=vpRotated()?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;
    return Math.min(1,Math.max(0,x));
  };
  const move=e=>{
    const d=VP.player&&VP.player.getDuration?VP.player.getDuration():0;
    if(!d) return;
    VP.dragT=ratio(e)*d;
    vpSetTimes(VP.dragT,d);
  };
  bar.addEventListener('pointerdown',e=>{
    if(!VP.player||!VP.player.getDuration||!VP.player.getDuration()) return;
    VP.dragging=true;
    try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    clearTimeout(VP.hideT);
    move(e);
    e.preventDefault();
  });
  bar.addEventListener('pointermove',e=>{ if(VP.dragging) move(e); });
  const end=()=>{
    if(!VP.dragging) return;
    VP.dragging=false;
    if(VP.player&&VP.dragT!==null) VP.player.seekTo(VP.dragT,true);
    VP.dragT=null;
    vpShowUI();
  };
  bar.addEventListener('pointerup',end);
  bar.addEventListener('pointercancel',end);
})();
// If YouTube's control script hasn't loaded after 15 seconds, switch to YouTube's own controls so the video can still be watched
function vpNative(id){
  const vp=vpEl('vp'), f=vpEl('vp-frame');
  if(!vp.classList.contains('open')||VP.ready||!f) return;
  vp.classList.add('native');
  f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1&fs=0';
}
function openVideo(btn,url){
  const id=ytId(url);
  if(!id){ openPDF(url); return; }
  const vp=vpEl('vp');
  const label=btn&&btn.querySelector('small');
  vpEl('vp-title').textContent=label?label.textContent:'Video Lecture';
  VP.player=null; VP.ready=false; VP.started=false; VP.dragging=false; VP.dragT=null; VP.speed=0;
  vpEl('vp-speed').textContent='1×';
  vpEl('vp-play').innerHTML=VP_PLAY;
  vpEl('vp-big').innerHTML=VP_PLAY;
  vpSetTimes(0,0);
  vp.className='vp open rot';   // opens sideways (landscape)
  vpAppChrome(true);
  document.body.style.overflow='hidden';
  const f=document.createElement('iframe');
  f.id='vp-frame';
  const origin=/^https?:$/.test(location.protocol)?'&origin='+encodeURIComponent(location.origin):'';
  f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&controls=0&rel=0&playsinline=1&fs=0&iv_load_policy=3&disablekb=1&enablejsapi=1'+origin;
  f.title='Video lecture';
  f.allow='autoplay; encrypted-media; picture-in-picture';
  f.referrerPolicy='strict-origin-when-cross-origin';
  const stage=vpEl('vp-stage');
  stage.innerHTML='';
  stage.appendChild(f);
  vpShowUI();
  vpLoadApi(()=>{
    if(vpEl('vp-frame')!==f||vp.classList.contains('native')) return;
    VP.player=new YT.Player(f,{events:{
      onReady:()=>{ VP.ready=true; clearTimeout(VP.apiT); vpTick(); },
      onStateChange:e=>vpState(e.data)
    }});
  });
  clearTimeout(VP.apiT);
  VP.apiT=setTimeout(()=>vpNative(id),15000);
  clearInterval(VP.timer);
  VP.timer=setInterval(vpTick,250);
  // Add one history step, so the phone's back button closes the player instead of leaving the page
  if(!(history.state&&history.state.ezVideo)) history.pushState({ezVideo:id},'');
}
function hideVideo(){
  const vp=vpEl('vp');
  if(!vp.classList.contains('open')) return;
  clearInterval(VP.timer); clearTimeout(VP.hideT); clearTimeout(VP.apiT);
  try{ if(VP.player&&VP.player.destroy) VP.player.destroy(); }catch(e){}
  VP.player=null; VP.ready=false; VP.started=false; VP.dragging=false;
  vp.className='vp';
  vpEl('vp-stage').innerHTML='';
  vpEl('vp-ui').classList.remove('hide');
  document.body.style.overflow='';
  vpAppChrome(false);
}
function closeVideo(){
  hideVideo();
  if(history.state&&history.state.ezVideo) history.back();
}
function rotateVideo(){ vpEl('vp').classList.toggle('rot'); vpShowUI(); }
window.addEventListener('popstate',hideVideo);

let curQuiz=null,answered=[];
function openQuiz(id){
  curQuiz=id;
  const qs=QD[id]||[];
  answered=new Array(qs.length).fill(null);
  document.getElementById('qtitle').textContent='Unit '+id+' Quiz';
  document.getElementById('qpips').innerHTML=qs.map((_,i)=>`<div class="pip" id="pip${i}"></div>`).join('');
  let html=`<div class="qscore" id="qscore"><div><div class="qs-num" id="qsnum">—</div><div class="qs-sub">Score</div></div><div class="qs-msg" id="qsmsg"></div></div>`;
  qs.forEach((q,qi)=>{
    html+=`<div class="qitem" id="qi${qi}"><div class="qlbl">Question ${qi+1} of ${qs.length}</div><div class="qtext">${q.q}</div><div class="qopts">${q.o.map((opt,oi)=>`<button class="qopt" id="opt${qi}_${oi}" onclick="ans(${qi},${oi},${q.a})"><span class="qltr">${['A','B','C','D'][oi]}</span>${opt}</button>`).join('')}</div></div>`;
  });
  document.getElementById('qbody').innerHTML=html;
  document.getElementById('qmodal').classList.add('open');
  document.body.style.overflow='hidden';
}
function ans(qi,oi,correct){
  if(answered[qi]!==null)return;
  answered[qi]=oi;
  const opts=document.querySelectorAll(`#qi${qi} .qopt`);
  opts.forEach(b=>b.classList.add('lock'));
  opts[correct].classList.add('cor');
  if(oi!==correct)opts[oi].classList.add('wrg');
  const pip=document.getElementById('pip'+qi);
  pip.classList.add('ans',oi===correct?'cor':'wrg');
  if(answered.every(a=>a!==null)){
    const score=answered.filter((a,i)=>a===QD[curQuiz][i].a).length;
    const total=QD[curQuiz].length;
    const pct=Math.round(score/total*100);
    const msgs=['📚 Keep Studying!','👍 Good Effort!','🎉 Well Done!','🏆 Perfect!'];
    const mi=pct<50?0:pct<70?1:pct<100?2:3;
    document.getElementById('qsnum').textContent=score+'/'+total;
    document.getElementById('qsmsg').textContent=msgs[mi];
    const sc=document.getElementById('qscore');
    sc.classList.add('show');
    sc.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function closeQuiz(){
  document.getElementById('qmodal').classList.remove('open');
  document.body.style.overflow='';
  curQuiz=null;
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('vp').classList.contains('open'))closeVideo();else closeQuiz();}});
